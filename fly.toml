app = "nudge-gtd"
primary_region = "ord"

[build]
  dockerfile = "Dockerfile"

[env]
  # Keys that encrypt the web UI's sign-in cookie, kept on the
  # volume so that a deploy does not sign the owner out.
  Nudge__DataProtection__KeysPath = "/data/keys"

[mounts]
  source = "nudge_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/healthz"
    interval = "30s"
    timeout = "5s"
    grace_period = "15s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
