name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore
      - run: dotnet build --no-restore --configuration Release
      # The browser for the Playwright smoke test, by the script the
      # built test project carries, at the version it was built for.
      - run: pwsh tests/Nudge.Web.UiTests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium
      - run: dotnet test --no-build --configuration Release
        env:
          NUDGE_PLAYWRIGHT: "1"
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: tests/Nudge.Web.UiTests/bin/Release/net10.0/playwright-artifacts
          if-no-files-found: ignore

  deploy:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    concurrency: deploy-production
    steps:
      - uses: actions/checkout@v5

      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6 (node24)

      - run: flyctl deploy --remote-only --ha=false
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
